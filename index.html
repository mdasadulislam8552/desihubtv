<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Desi Hub TV</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #08090d;
      color: #fff;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    .app {
      max-width: 650px;
      margin: auto;
      padding: 18px 14px 95px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .logo {
      font-size: 23px;
      font-weight: 800;
    }

    .logo span {
      color: #ff3158;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #20222b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .hero {
      padding: 24px;
      border-radius: 22px;
      margin-bottom: 18px;
      background: linear-gradient(135deg, #27121c, #151720);
      border: 1px solid #2b2d38;
    }

    .hero h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .hero p {
      color: #a7a9b2;
      font-size: 14px;
    }

    .search {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid #2a2c36;
      background: #15161d;
      color: #fff;
      outline: none;
      font-size: 15px;
      margin-bottom: 15px;
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 22px;
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .cat {
      padding: 9px 15px;
      border-radius: 20px;
      border: 1px solid #30323d;
      background: #15161d;
      color: #bbb;
      white-space: nowrap;
      cursor: pointer;
    }

    .cat.active {
      background: #ff3158;
      border-color: #ff3158;
      color: #fff;
    }

    .titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .titlebar h2 {
      font-size: 19px;
    }

    .count {
      color: #777a84;
      font-size: 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .card {
      background: #15161d;
      border: 1px solid #292b35;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
    }

    .thumbnail {
      aspect-ratio: 9 / 13;
      background: linear-gradient(145deg, #242631, #101116);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .play {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: rgba(255,49,88,.92);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      padding-left: 3px;
    }

    .card-info {
      padding: 11px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-category {
      color: #ff5272;
      font-size: 12px;
      margin-top: 5px;
    }

    .loading,
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 45px 10px;
      color: #777a84;
    }

    .bottom {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      max-width: 650px;
      margin: auto;
      padding: 10px 5px calc(10px + env(safe-area-inset-bottom));
      background: rgba(12,13,18,.97);
      border-top: 1px solid #292b35;
      display: flex;
      justify-content: space-around;
      z-index: 100;
    }

    .bottom button {
      border: 0;
      background: none;
      color: #777;
      font-size: 12px;
    }

    .bottom button.active {
      color: #ff3158;
    }

    .player {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .player video {
      width: 100%;
      max-width: 700px;
      max-height: 90vh;
      background: #000;
    }

    .close-player {
      position: fixed;
      top: 15px;
      right: 15px;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,.15);
      color: white;
      font-size: 25px;
      z-index: 10000;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="logo">Desi <span>Hub TV</span></div>
    <div class="avatar" id="avatar">D</div>
  </div>

  <div class="hero">
    <h1>Watch. Discover. Enjoy.</h1>
    <p>Fresh reels and viral videos in one place.</p>
  </div>

  <input
    id="search"
    class="search"
    type="text"
    placeholder="🔎 Search videos..."
  >

  <div class="categories">
    <button class="cat active" data-category="All">All</button>
    <button class="cat" data-category="Instagram">Instagram</button>
    <button class="cat" data-category="TikTok">TikTok</button>
    <button class="cat" data-category="Viral">Viral</button>
  </div>

  <div class="titlebar">
    <h2>Latest Videos</h2>
    <span class="count" id="count">0 videos</span>
  </div>

  <div id="videos" class="grid">
    <div class="loading">Loading videos...</div>
  </div>

</div>

<div class="bottom">
  <button class="active">🏠<br>Home</button>
  <button>🔥<br>Viral</button>
  <button>❤️<br>Saved</button>
  <button>👤<br>Profile</button>
</div>

<script>

const SUPABASE_URL =
  "https://icievlmrfbanhoaqvtwz.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_CgovIrCCYoka2GeHzjgLZg_lYbdy-D8";

const tg = window.Telegram?.WebApp;

if (tg) {
  tg.ready();
  tg.expand();

  const user = tg.initDataUnsafe?.user;

  if (user) {
    document.getElementById("avatar").textContent =
      (user.first_name || "D").charAt(0).toUpperCase();
  }
}

let videos = [];
let selectedCategory = "All";

async function loadVideos() {

  const container = document.getElementById("videos");

  try {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/videos?select=*&order=created_at.desc`,
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    if (!response.ok) {
      throw new Error(await response.text());
    }

    videos = await response.json();

    renderVideos();

  } catch (error) {

    console.error("Supabase error:", error);

    container.innerHTML =
      `<div class="empty">
        Failed to load videos.
      </div>`;
  }
}

function renderVideos() {

  const container = document.getElementById("videos");

  const search =
    document.getElementById("search").value
    .trim()
    .toLowerCase();

  const filtered = videos.filter(video => {

    const categoryOK =
      selectedCategory === "All" ||
      video.category === selectedCategory;

    const searchOK =
      (video.title || "")
      .toLowerCase()
      .includes(search);

    return categoryOK && searchOK;
  });

  document.getElementById("count").textContent =
    `${filtered.length} video${filtered.length === 1 ? "" : "s"}`;

  if (!filtered.length) {

    container.innerHTML =
      `<div class="empty">
        No videos found.
      </div>`;

    return;
  }

  container.innerHTML = filtered.map(video => `

    <div
      class="card"
      onclick="playVideo('${escapeAttr(video.file_id)}')"
    >

      <div class="thumbnail">
        <div class="play">▶</div>
      </div>

      <div class="card-info">

        <div class="card-title">
          ${escapeHtml(video.title || "Untitled")}
        </div>

        <div class="card-category">
          ${escapeHtml(video.category || "Other")}
        </div>

      </div>

    </div>

  `).join("");
}

function playVideo(fileId) {

  const url =
    `/api/video?file_id=${encodeURIComponent(fileId)}`;

  const player = document.createElement("div");

  player.className = "player";

  player.innerHTML = `

    <button
      class="close-player"
      onclick="this.parentElement.remove()"
    >
      ×
    </button>

    <video
      controls
      autoplay
      playsinline
      preload="metadata"
    >
      <source
        src="${url}"
        type="video/mp4"
      >
    </video>

  `;

  document.body.appendChild(player);

  const video =
    player.querySelector("video");

  video.play().catch(() => {});
}

function escapeHtml(text) {

  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function escapeAttr(text) {

  return String(text)
    .replaceAll("\\", "\\\\")
    .replaceAll("'", "\\'");
}

document
  .querySelectorAll(".cat")
  .forEach(button => {

    button.addEventListener("click", () => {

      document
        .querySelectorAll(".cat")
        .forEach(btn =>
          btn.classList.remove("active")
        );

      button.classList.add("active");

      selectedCategory =
        button.dataset.category;

      renderVideos();
    });

  });

document
  .getElementById("search")
  .addEventListener("input", renderVideos);

loadVideos();

</script>

</body>
</html>
