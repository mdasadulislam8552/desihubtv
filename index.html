<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Desi Hub TV</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#07080c;
  --card:#11131a;
  --border:rgba(255,255,255,.08);
  --text:#fff;
  --muted:#858895;
  --pink:#ff3158;
  --pink2:#ff6683;
}

html,body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  min-height:100vh;
}

button,input{font:inherit}
button{cursor:pointer}

.app{
  width:100%;
  max-width:680px;
  margin:auto;
  padding:16px 14px calc(105px + env(safe-area-inset-bottom));
}

/* HEADER */

.header{
  height:52px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand-logo{
  width:40px;
  height:40px;
  border-radius:13px;
  background:linear-gradient(135deg,#ff3158,#ff1748);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  font-weight:900;
}

.logo-text{
  font-size:20px;
  font-weight:850;
}

.logo-text span{
  color:var(--pink);
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  background:linear-gradient(135deg,#ff3158,#ff6b85);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-weight:800;
  border:2px solid rgba(255,255,255,.12);
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* HERO */

.hero{
  position:relative;
  overflow:hidden;
  padding:24px 21px;
  border-radius:25px;
  margin-bottom:18px;
  background:
    radial-gradient(circle at 90% 10%,rgba(255,49,88,.25),transparent 35%),
    linear-gradient(135deg,#241019,#11131b 70%);
  border:1px solid var(--border);
}

.hero-badge{
  display:inline-flex;
  padding:6px 10px;
  border-radius:30px;
  background:rgba(255,49,88,.11);
  border:1px solid rgba(255,49,88,.2);
  color:#ff7892;
  font-size:11px;
  font-weight:700;
  margin-bottom:11px;
}

.hero h1{
  font-size:27px;
  line-height:1.12;
  margin-bottom:9px;
}

.hero p{
  color:#a8abb6;
  font-size:13px;
  line-height:1.5;
}

/* SEARCH */

.search-wrap{
  position:relative;
  margin-bottom:16px;
}

.search-icon{
  position:absolute;
  left:15px;
  top:50%;
  transform:translateY(-50%);
  pointer-events:none;
  color:#777b87;
}

.search{
  width:100%;
  height:48px;
  padding:0 15px 0 43px;
  border-radius:15px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.045);
  color:#fff;
  outline:none;
  font-size:14px;
}

.search::placeholder{
  color:#6f727d;
}

/* CATEGORIES */

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-bottom:22px;
  scrollbar-width:none;
}

.categories::-webkit-scrollbar{
  display:none;
}

.cat{
  flex:0 0 auto;
  padding:9px 15px;
  border-radius:30px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.035);
  color:#999ca7;
  font-size:12px;
  font-weight:650;
}

.cat.active{
  background:var(--pink);
  border-color:var(--pink);
  color:#fff;
}

/* SECTION */

.titlebar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:13px;
}

.titlebar h2{
  font-size:18px;
}

.count{
  color:#6f727d;
  font-size:11px;
}

/* GRID */

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.card{
  background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.025));
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
}

.thumbnail{
  aspect-ratio:9/13;
  background:#171820;
  position:relative;
  overflow:hidden;
}

.thumbnail img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.thumbnail:after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to top,rgba(0,0,0,.55),transparent 45%);
  pointer-events:none;
}

.thumbnail-placeholder{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(145deg,#292b36,#101116);
  font-size:35px;
}

.play{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:52px;
  height:52px;
  border-radius:50%;
  background:rgba(255,49,88,.95);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
  padding-left:3px;
  z-index:3;
}

.save-btn{
  position:absolute;
  right:8px;
  top:8px;
  width:35px;
  height:35px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.68);
  color:#fff;
  font-size:18px;
  z-index:5;
}

.save-btn.saved{
  color:var(--pink);
}

.card-info{
  padding:12px;
}

.card-title{
  font-size:13px;
  font-weight:750;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.card-category{
  color:#ff5b78;
  font-size:10px;
  margin-top:5px;
  text-transform:uppercase;
  letter-spacing:.4px;
  font-weight:700;
}

.stats{
  display:flex;
  align-items:center;
  gap:11px;
  margin-top:9px;
  color:#777a86;
  font-size:10px;
}

.stat{
  display:flex;
  align-items:center;
  gap:3px;
}

.like-btn{
  border:0;
  background:transparent;
  color:#858792;
  padding:0;
}

/* TRENDING BADGE */

.trending-badge{
  position:absolute;
  left:8px;
  top:8px;
  z-index:5;
  padding:5px 8px;
  border-radius:20px;
  background:rgba(255,49,88,.92);
  color:white;
  font-size:9px;
  font-weight:800;
}

/* EMPTY */

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:55px 10px;
  color:#71747f;
  font-size:13px;
}

/* BOTTOM NAV */

.bottom{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:0;
  width:100%;
  max-width:680px;
  padding:9px 8px calc(9px + env(safe-area-inset-bottom));
  background:rgba(10,11,16,.96);
  backdrop-filter:blur(18px);
  border-top:1px solid rgba(255,255,255,.07);
  display:grid;
  grid-template-columns:repeat(4,1fr);
  z-index:1000;
}

.bottom button{
  border:0;
  background:none;
  color:#70737e;
  font-size:10px;
  line-height:17px;
}

.bottom button .nav-icon{
  display:block;
  font-size:18px;
  line-height:22px;
}

.bottom button.active{
  color:var(--pink);
}

/* PROFILE */

.profile{
  overflow:hidden;
  background:linear-gradient(145deg,#171923,#101117);
  border:1px solid var(--border);
  border-radius:25px;
  padding:30px 20px;
  text-align:center;
}

.profile-cover{
  height:95px;
  margin:-30px -20px 0;
  background:
    radial-gradient(circle at 50% 0,rgba(255,49,88,.3),transparent 60%),
    linear-gradient(135deg,#211019,#12141b);
}

.profile-avatar{
  width:92px;
  height:92px;
  border-radius:50%;
  background:linear-gradient(135deg,#ff3158,#ff6b85);
  margin:-46px auto 15px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  font-weight:800;
  overflow:hidden;
  border:4px solid #11131a;
}

.profile-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile h2{
  margin-bottom:7px;
  font-size:22px;
}

.username{
  color:var(--pink2);
  font-size:13px;
  margin-bottom:22px;
}

.profile-stats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
}

.profile-stat{
  padding:13px 8px;
  border-radius:14px;
  background:rgba(255,255,255,.035);
  border:1px solid var(--border);
}

.profile-stat strong{
  display:block;
  font-size:17px;
  margin-bottom:3px;
}

.profile-stat span{
  color:#777a85;
  font-size:10px;
}

/* DETAILS */

.details{
  animation:detailsIn .22s ease;
}

@keyframes detailsIn{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}

.back-btn{
  border:1px solid var(--border);
  background:rgba(255,255,255,.05);
  color:#fff;
  padding:9px 13px;
  border-radius:12px;
  font-size:12px;
  margin-bottom:14px;
}

.details-media{
  position:relative;
  width:100%;
  aspect-ratio:16/10;
  border-radius:21px;
  overflow:hidden;
  background:#111;
  border:1px solid var(--border);
  margin-bottom:16px;
}

.details-media img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.details-placeholder{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:55px;
}

.details-play{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:65px;
  height:65px;
  border-radius:50%;
  border:0;
  background:var(--pink);
  color:#fff;
  font-size:24px;
}

.details-category{
  display:inline-flex;
  padding:6px 10px;
  border-radius:20px;
  background:rgba(255,49,88,.1);
  border:1px solid rgba(255,49,88,.2);
  color:#ff6985;
  font-size:10px;
  font-weight:750;
  text-transform:uppercase;
  margin-bottom:9px;
}

.details-title{
  font-size:24px;
  line-height:1.25;
  margin-bottom:12px;
}

.details-stats{
  display:flex;
  gap:16px;
  color:#888b96;
  font-size:12px;
  padding-bottom:17px;
  border-bottom:1px solid var(--border);
  margin-bottom:17px;
}

.details-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.action-btn{
  height:46px;
  border-radius:14px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.045);
  color:#fff;
  font-weight:700;
  font-size:13px;
}

.action-btn.primary{
  background:var(--pink);
  border-color:var(--pink);
}

.action-btn.saved{
  color:var(--pink);
}

/* PLAYER */

.player{
  position:fixed;
  inset:0;
  z-index:9999;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
}

.player video{
  width:100%;
  max-width:760px;
  max-height:90vh;
  background:#000;
}

.close-player{
  position:fixed;
  top:15px;
  right:15px;
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.14);
  color:#fff;
  font-size:25px;
  z-index:10000;
}

@media(max-width:380px){
  .app{padding-left:11px;padding-right:11px}
  .grid{gap:9px}
}
</style>
</head>

<body>

<div class="app">

  <div class="header">

    <div class="brand">
      <div class="brand-logo">DH</div>

      <div class="logo-text">
        Desi <span>Hub TV</span>
      </div>
    </div>

    <div class="avatar" id="avatar">D</div>

  </div>

  <div id="content"></div>

</div>


<div class="bottom">

  <button id="navHome" class="active">
    <span class="nav-icon">🏠</span>
    Home
  </button>

  <button id="navViral">
    <span class="nav-icon">🔥</span>
    Trending
  </button>

  <button id="navSaved">
    <span class="nav-icon">❤️</span>
    Saved
  </button>

  <button id="navProfile">
    <span class="nav-icon">👤</span>
    Profile
  </button>

</div>


<script>

const SUPABASE_URL =
"https://icievlmrfbanhoaqvtwz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_CgovIrCCYoka2GeHzjgLZg_lYbdy-D8";


const tg =
window.Telegram?.WebApp;

if(tg){
  tg.ready();
  tg.expand();
}

const telegramUser =
tg?.initDataUnsafe?.user || null;

const userId =
telegramUser?.id || null;


let videos = [];
let savedIds = new Set();

let currentPage = "home";
let selectedCategory = "All";
let selectedVideo = null;


/* TELEGRAM PROFILE */

function setupTelegramProfile(){

  const avatar =
  document.getElementById("avatar");

  if(!telegramUser){

    avatar.textContent = "D";
    return;
  }

  if(telegramUser.photo_url){

    avatar.innerHTML = `
      <img
        src="${escapeAttr(telegramUser.photo_url)}"
        alt="Profile"
      >
    `;

  }else{

    avatar.textContent =
    (telegramUser.first_name || "D")
    .charAt(0)
    .toUpperCase();

  }
}

setupTelegramProfile();


/* LOAD VIDEOS */

async function loadVideos(){

  try{

    const response =
    await fetch(
      `${SUPABASE_URL}/rest/v1/videos?select=*&order=created_at.desc`,
      {
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":`Bearer ${SUPABASE_KEY}`
        }
      }
    );

    if(!response.ok)
      throw new Error(await response.text());

    videos =
    await response.json();

  }catch(error){

    console.error(
      "VIDEO LOAD ERROR:",
      error
    );

    videos = [];
  }
}


/* LOAD SAVED */

async function loadSaved(){

  if(!userId){
    savedIds = new Set();
    return;
  }

  try{

    const response =
    await fetch(
      `${SUPABASE_URL}/rest/v1/saved_videos?telegram_user_id=eq.${userId}&select=video_id`,
      {
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":`Bearer ${SUPABASE_KEY}`
        }
      }
    );

    if(!response.ok)
      throw new Error(await response.text());

    const data =
    await response.json();

    savedIds =
    new Set(
      data.map(
        item => Number(item.video_id)
      )
    );

  }catch(error){

    console.error(
      "SAVED LOAD ERROR:",
      error
    );

    savedIds = new Set();
  }
}


/* SAVE */

async function toggleSave(videoId){

  if(!userId){

    alert(
      "Please open this app from Telegram."
    );

    return;
  }

  const id = Number(videoId);

  try{

    if(savedIds.has(id)){

      const response =
      await fetch(
        `${SUPABASE_URL}/rest/v1/saved_videos?telegram_user_id=eq.${userId}&video_id=eq.${id}`,
        {
          method:"DELETE",
          headers:{
            "apikey":SUPABASE_KEY,
            "Authorization":`Bearer ${SUPABASE_KEY}`
          }
        }
      );

      if(response.ok)
        savedIds.delete(id);

    }else{

      const response =
      await fetch(
        `${SUPABASE_URL}/rest/v1/saved_videos`,
        {
          method:"POST",
          headers:{
            "apikey":SUPABASE_KEY,
            "Authorization":`Bearer ${SUPABASE_KEY}`,
            "Content-Type":"application/json",
            "Prefer":"return=minimal"
          },
          body:JSON.stringify({
            telegram_user_id:userId,
            video_id:id
          })
        }
      );

      if(response.ok)
        savedIds.add(id);
    }

    render();

  }catch(error){

    console.error(
      "SAVE ERROR:",
      error
    );
  }
}


/* VIEW */

async function addView(videoId){

  const video =
  videos.find(
    v => Number(v.id) === Number(videoId)
  );

  if(!video) return;

  const newViews =
  Number(video.views || 0) + 1;

  video.views = newViews;

  try{

    await fetch(
      `${SUPABASE_URL}/rest/v1/videos?id=eq.${videoId}`,
      {
        method:"PATCH",
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":`Bearer ${SUPABASE_KEY}`,
          "Content-Type":"application/json",
          "Prefer":"return=minimal"
        },
        body:JSON.stringify({
          views:newViews
        })
      }
    );

  }catch(error){

    console.error(
      "VIEW ERROR:",
      error
    );
  }
}


/* LIKE */

async function addLike(videoId){

  const video =
  videos.find(
    v => Number(v.id) === Number(videoId)
  );

  if(!video) return;

  const newLikes =
  Number(video.likes || 0) + 1;

  video.likes = newLikes;

  render();

  try{

    await fetch(
      `${SUPABASE_URL}/rest/v1/videos?id=eq.${videoId}`,
      {
        method:"PATCH",
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":`Bearer ${SUPABASE_KEY}`,
          "Content-Type":"application/json",
          "Prefer":"return=minimal"
        },
        body:JSON.stringify({
          likes:newLikes
        })
      }
    );

  }catch(error){

    console.error(
      "LIKE ERROR:",
      error
    );
  }
}


/* TRENDING SCORE */

function trendingScore(video){

  const views =
  Number(video.views || 0);

  const likes =
  Number(video.likes || 0);

  /*
    Trending formula:
    Views = main weight
    Likes = stronger engagement weight
  */

  return (
    views +
    (likes * 5)
  );
}


/* GET TRENDING */

function getTrendingVideos(){

  return [...videos]
    .sort(
      (a,b) =>
        trendingScore(b) -
        trendingScore(a)
    )
    .slice(0,20);
}


/* MAIN RENDER */

function render(){

  if(currentPage === "profile"){
    renderProfile();
    return;
  }

  if(currentPage === "details"){
    renderDetails(selectedVideo);
    return;
  }

  const content =
  document.getElementById("content");

  let list = videos;

  if(currentPage === "viral"){
    list = getTrendingVideos();
  }

  if(currentPage === "saved"){

    list =
    videos.filter(
      video =>
        savedIds.has(Number(video.id))
    );
  }


  const heading =
  currentPage === "viral"
    ? "🔥 Trending Now"
    : currentPage === "saved"
    ? "❤️ Saved Videos"
    : "Watch. Discover. Enjoy.";


  const description =
  currentPage === "viral"
    ? "The hottest videos based on views and likes."
    : currentPage === "saved"
    ? "Your personal saved collection."
    : "Fresh reels and viral videos in one place.";


  content.innerHTML = `

    <div class="hero">

      <div class="hero-badge">
        ✦ DESI HUB TV V2
      </div>

      <h1>
        ${heading}
      </h1>

      <p>
        ${description}
      </p>

    </div>


    ${
      currentPage !== "saved"
      ? `
        <div class="search-wrap">

          <span class="search-icon">
            🔎
          </span>

          <input
            id="search"
            class="search"
            type="text"
            placeholder="Search videos..."
          >

        </div>
      `
      : ""
    }


    ${
      currentPage === "home"
      ? `
        <div class="categories">

          <button
            class="cat ${
              selectedCategory === "All"
              ? "active"
              : ""
            }"
            data-category="All"
          >
            All
          </button>

          <button
            class="cat ${
              selectedCategory === "Instagram"
              ? "active"
              : ""
            }"
            data-category="Instagram"
          >
            Instagram
          </button>

          <button
            class="cat ${
              selectedCategory === "TikTok"
              ? "active"
              : ""
            }"
            data-category="TikTok"
          >
            TikTok
          </button>

          <button
            class="cat ${
              selectedCategory === "Viral"
              ? "active"
              : ""
            }"
            data-category="Viral"
          >
            Viral
          </button>

          <button
            class="cat ${
              selectedCategory === "Deshi"
              ? "active"
              : ""
            }"
            data-category="Deshi"
          >
            Deshi
          </button>

        </div>
      `
      : ""
    }


    <div class="titlebar">

      <h2>
        ${
          currentPage === "viral"
          ? "Top Trending"
          : currentPage === "saved"
          ? "Your Collection"
          : "Latest Videos"
        }
      </h2>

      <span class="count">
        ${list.length} videos
      </span>

    </div>


    <div
      id="videoGrid"
      class="grid"
    ></div>

  `;


  let filtered = list;


  if(currentPage === "home"){

    filtered =
    list.filter(
      video =>
        selectedCategory === "All" ||
        video.category === selectedCategory
    );

  }


  renderGrid(filtered);


  const search =
  document.getElementById("search");


  if(search){

    search.addEventListener(
      "input",
      () => {

        const term =
        search.value
        .toLowerCase()
        .trim();

        const results =
        filtered.filter(
          video =>
            (
              video.title || ""
            )
            .toLowerCase()
            .includes(term)
        );

        renderGrid(results);
      }
    );
  }


  document
  .querySelectorAll(".cat")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        selectedCategory =
        button.dataset.category;

        render();
      }
    );

  });
}


/* VIDEO GRID */

function renderGrid(list){

  const grid =
  document.getElementById("videoGrid");

  if(!grid) return;


  if(!list.length){

    grid.innerHTML = `
      <div class="empty">
        🎬<br><br>
        No videos found.
      </div>
    `;

    return;
  }


  const trendingIds =
  new Set(
    getTrendingVideos()
    .slice(0,5)
    .map(v => Number(v.id))
  );


  grid.innerHTML =
  list.map(video => {

    const id =
    Number(video.id);

    const isSaved =
    savedIds.has(id);

    const thumbnail =
    video.thumbnail_file_id
      ? `/api/thumbnail?file_id=${encodeURIComponent(video.thumbnail_file_id)}`
      : "";


    return `

      <div
        class="card"
        onclick="openDetails(${id})"
      >

        <div class="thumbnail">

          ${
            currentPage === "viral" &&
            trendingIds.has(id)
            ? `
              <div class="trending-badge">
                🔥 TRENDING
              </div>
            `
            : ""
          }


          ${
            thumbnail
            ? `
              <img
                src="${thumbnail}"
                alt=""
                loading="lazy"
              >
            `
            : `
              <div class="thumbnail-placeholder">
                🎬
              </div>
            `
          }


          <button
            class="save-btn ${
              isSaved ? "saved" : ""
            }"
            onclick="
              event.stopPropagation();
              toggleSave(${id})
            "
          >
            ${isSaved ? "♥" : "♡"}
          </button>


          <div class="play">
            ▶
          </div>

        </div>


        <div class="card-info">

          <div class="card-title">
            ${escapeHtml(
              video.title ||
              "Untitled Video"
            )}
          </div>


          <div class="card-category">
            ${escapeHtml(
              video.category ||
              "Other"
            )}
          </div>


          <div class="stats">

            <span class="stat">
              👁
              ${formatNumber(
                video.views || 0
              )}
            </span>


            <button
              class="like-btn stat"
              onclick="
                event.stopPropagation();
                addLike(${id})
              "
            >
              ❤️
              ${formatNumber(
                video.likes || 0
              )}
            </button>

          </div>

        </div>

      </div>

    `;

  }).join("");
}


/* DETAILS */

function openDetails(videoId){

  const video =
  videos.find(
    v => Number(v.id) === Number(videoId)
  );

  if(!video) return;

  selectedVideo = video;
  currentPage = "details";

  document
  .querySelectorAll(".bottom button")
  .forEach(
    b => b.classList.remove("active")
  );

  render();
}


function renderDetails(video){

  const content =
  document.getElementById("content");

  if(!video){

    currentPage = "home";
    render();
    return;
  }


  const id =
  Number(video.id);

  const isSaved =
  savedIds.has(id);

  const thumbnail =
  video.thumbnail_file_id
    ? `/api/thumbnail?file_id=${encodeURIComponent(video.thumbnail_file_id)}`
    : "";


  content.innerHTML = `

    <div class="details">

      <button
        class="back-btn"
        onclick="goBack()"
      >
        ← Back
      </button>


      <div class="details-media">

        ${
          thumbnail
          ? `
            <img
              src="${thumbnail}"
              alt=""
            >
          `
          : `
            <div class="details-placeholder">
              🎬
            </div>
          `
        }


        <button
          class="details-play"
          onclick="
            playVideo(
              '${escapeAttr(video.file_id)}',
              ${id}
            )
          "
        >
          ▶
        </button>

      </div>


      <div class="details-category">
        ${escapeHtml(
          video.category || "Other"
        )}
      </div>


      <h1 class="details-title">
        ${escapeHtml(
          video.title || "Untitled Video"
        )}
      </h1>


      <div class="details-stats">

        <span>
          👁
          ${formatNumber(video.views || 0)}
          views
        </span>

        <span>
          ❤️
          ${formatNumber(video.likes || 0)}
          likes
        </span>

      </div>


      <div class="details-actions">

        <button
          class="action-btn primary"
          onclick="
            playVideo(
              '${escapeAttr(video.file_id)}',
              ${id}
            )
          "
        >
          ▶ Watch Video
        </button>


        <button
          class="action-btn ${
            isSaved ? "saved" : ""
          }"
          onclick="
            toggleSave(${id})
          "
        >
          ${
            isSaved
            ? "♥ Saved"
            : "♡ Save Video"
          }
        </button>

      </div>

    </div>

  `;
}


/* BACK */

function goBack(){

  currentPage = "home";
  selectedVideo = null;

  setActive("navHome");

  render();
}


/* PROFILE */

function renderProfile(){

  const content =
  document.getElementById("content");

  const firstName =
  telegramUser?.first_name ||
  "Telegram User";

  const lastName =
  telegramUser?.last_name ||
  "";

  const fullName =
  `${firstName} ${lastName}`.trim();

  const username =
  telegramUser?.username
    ? `@${telegramUser.username}`
    : "Telegram account";


  let image = "";


  if(telegramUser?.photo_url){

    image = `
      <img
        src="${escapeAttr(
          telegramUser.photo_url
        )}"
        alt="Telegram Profile"
      >
    `;

  }else{

    image =
    escapeHtml(
      firstName
      .charAt(0)
      .toUpperCase()
    );

  }


  content.innerHTML = `

    <div class="profile">

      <div class="profile-cover"></div>


      <div class="profile-avatar">
        ${image}
      </div>


      <h2>
        ${escapeHtml(fullName)}
      </h2>


      <div class="username">
        ${escapeHtml(username)}
      </div>


      <div class="profile-stats">

        <div class="profile-stat">
          <strong>
            ${savedIds.size}
          </strong>
          <span>
            Saved Videos
          </span>
        </div>


        <div class="profile-stat">
          <strong>
            ${videos.length}
          </strong>
          <span>
            Total Videos
          </span>
        </div>

      </div>

    </div>

  `;
}


/* VIDEO PLAYER */

function playVideo(fileId,videoId){

  addView(videoId);

  const url =
  `/api/video?file_id=${encodeURIComponent(fileId)}`;


  const player =
  document.createElement("div");

  player.className = "player";


  player.innerHTML = `

    <button
      class="close-player"
      onclick="this.parentElement.remove()"
    >
      ×
    </button>


    <video
      controls
      autoplay
      playsinline
      preload="metadata"
    >

      <source
        src="${url}"
        type="video/mp4"
      >

    </video>

  `;


  document.body.appendChild(player);


  const video =
  player.querySelector("video");

  video
  .play()
  .catch(() => {});
}


/* ACTIVE NAV */

function setActive(id){

  document
  .querySelectorAll(".bottom button")
  .forEach(
    b => b.classList.remove("active")
  );

  const button =
  document.getElementById(id);

  if(button)
    button.classList.add("active");
}


/* NAV */

document
.getElementById("navHome")
.addEventListener("click",()=>{

  currentPage = "home";
  selectedVideo = null;

  setActive("navHome");

  render();

});


document
.getElementById("navViral")
.addEventListener("click",()=>{

  currentPage = "viral";
  selectedVideo = null;

  setActive("navViral");

  render();

});


document
.getElementById("navSaved")
.addEventListener("click",()=>{

  currentPage = "saved";
  selectedVideo = null;

  setActive("navSaved");

  render();

});


document
.getElementById("navProfile")
.addEventListener("click",()=>{

  currentPage = "profile";
  selectedVideo = null;

  setActive("navProfile");

  render();

});


/* NUMBER FORMAT */

function formatNumber(number){

  number =
  Number(number || 0);

  if(number >= 1000000)
    return (number/1000000).toFixed(1)+"M";

  if(number >= 1000)
    return (number/1000).toFixed(1)+"K";

  return String(number);
}


/* ESCAPE */

function escapeHtml(text){

  return String(text)
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}


function escapeAttr(text){

  return String(text)
  .replaceAll("\\","\\\\")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}


/* START */

async function startApp(){

  await loadVideos();

  await loadSaved();

  render();
}

startApp();
