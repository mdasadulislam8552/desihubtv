function openVideo(fileId) {

  const videoUrl =
    `/api/video?file_id=${encodeURIComponent(fileId)}`;

  const player = document.createElement("div");

  player.innerHTML = `
    <div style="
      position:fixed;
      inset:0;
      z-index:9999;
      background:#000;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:16px;
    ">

      <div style="
        width:100%;
        max-width:600px;
        position:relative;
      ">

        <button
          onclick="this.parentElement.parentElement.remove()"
          style="
            position:absolute;
            right:8px;
            top:-45px;
            width:38px;
            height:38px;
            border:0;
            border-radius:50%;
            background:#222;
            color:#fff;
            font-size:20px;
            z-index:2;
          "
        >×</button>

        <video
          controls
          autoplay
          playsinline
          style="
            width:100%;
            max-height:80vh;
            border-radius:14px;
            background:#000;
          "
        >
          <source src="${videoUrl}" type="video/mp4">
          Your browser does not support video playback.
        </video>

      </div>

    </div>
  `;

  document.body.appendChild(player);
}
