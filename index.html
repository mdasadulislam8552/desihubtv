<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Desi Hub TV</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #08090d;
      color: #fff;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    button,
    input {
      font-family: inherit;
    }

    .app {
      max-width: 650px;
      margin: auto;
      padding: 18px 14px 100px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .logo {
      font-size: 23px;
      font-weight: 800;
    }

    .logo span {
      color: #ff3158;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #ff3158;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero {
      padding: 24px;
      border-radius: 22px;
      margin-bottom: 18px;
      background: linear-gradient(135deg, #27121c, #151720);
      border: 1px solid #2b2d38;
    }

    .hero h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .hero p {
      color: #a7a9b2;
      font-size: 14px;
    }

    .search {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid #2a2c36;
      background: #15161d;
      color: #fff;
      outline: none;
      font-size: 15px;
      margin-bottom: 15px;
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 22px;
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .cat {
      padding: 9px 15px;
      border-radius: 20px;
      border: 1px solid #30323d;
      background: #15161d;
      color: #bbb;
      white-space: nowrap;
      cursor: pointer;
    }

    .cat.active {
      background: #ff3158;
      border-color: #ff3158;
      color: #fff;
    }

    .titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .titlebar h2 {
      font-size: 19px;
    }

    .count {
      color: #777a84;
      font-size: 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .card {
      background: #15161d;
      border: 1px solid #292b35;
      border-radius: 16px;
      overflow: hidden;
    }

    .thumbnail {
      aspect-ratio: 9 / 13;
      background: #171820;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .thumbnail-placeholder {
      width: 100%;
      height: 100%;
      background: linear-gradient(145deg, #292b36, #101116);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 35px;
    }

    .play {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: rgba(255, 49, 88, .94);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      padding-left: 3px;
    }

    .save-btn {
      position: absolute;
      right: 8px;
      top: 8px;
      width: 35px;
      height: 35px;
      border: 0;
      border-radius: 50%;
      background: rgba(0, 0, 0, .7);
      color: #fff;
      font-size: 18px;
      z-index: 3;
      cursor: pointer;
    }

    .save-btn.saved {
      color: #ff3158;
    }

    .card-info {
      padding: 11px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-category {
      color: #ff5272;
      font-size: 12px;
      margin-top: 5px;
    }

    .stats {
      display: flex;
      gap: 12px;
      margin-top: 8px;
      color: #858792;
      font-size: 11px;
    }

    .stat {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .like-btn {
      border: 0;
      background: transparent;
      color: #858792;
      cursor: pointer;
      padding: 0;
    }

    .like-btn:hover {
      color: #ff3158;
    }

    .loading,
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 45px 10px;
      color: #777a84;
    }

    .bottom {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      max-width: 650px;
      margin: auto;
      padding: 10px 5px calc(10px + env(safe-area-inset-bottom));
      background: rgba(12, 13, 18, .98);
      border-top: 1px solid #292b35;
      display: flex;
      justify-content: space-around;
      z-index: 100;
    }

    .bottom button {
      border: 0;
      background: none;
      color: #777;
      font-size: 12px;
      line-height: 18px;
      cursor: pointer;
    }

    .bottom button.active {
      color: #ff3158;
    }

    .profile {
      background: #15161d;
      border: 1px solid #292b35;
      border-radius: 20px;
      padding: 28px 20px;
      text-align: center;
    }

    .profile-avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #ff3158;
      margin: 0 auto 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 800;
      overflow: hidden;
    }

    .profile-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile h2 {
      margin-bottom: 7px;
      font-size: 22px;
    }

    .profile .username {
      color: #ff5272;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .profile .info {
      color: #888;
      font-size: 14px;
      line-height: 24px;
    }

    .player {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .player video {
      width: 100%;
      max-width: 700px;
      max-height: 90vh;
      background: #000;
    }

    .close-player {
      position: fixed;
      top: 15px;
      right: 15px;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, .15);
      color: #fff;
      font-size: 25px;
      z-index: 10000;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="logo">Desi <span>Hub TV</span></div>
    <div class="avatar" id="avatar">D</div>
  </div>

  <div id="content"></div>

</div>

<div class="bottom">

  <button id="navHome" class="active">
    🏠<br>Home
  </button>

  <button id="navViral">
    🔥<br>Viral
  </button>

  <button id="navSaved">
    ❤️<br>Saved
  </button>

  <button id="navProfile">
    👤<br>Profile
  </button>

</div>

<script>

const SUPABASE_URL =
  "https://icievlmrfbanhoaqvtwz.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_CgovIrCCYoka2GeHzjgLZg_lYbdy-D8";

const tg = window.Telegram?.WebApp;

if (tg) {
  tg.ready();
  tg.expand();
}

const telegramUser =
  tg?.initDataUnsafe?.user || null;

const userId =
  telegramUser?.id || null;

let videos = [];
let savedIds = new Set();
let currentPage = "home";
let selectedCategory = "All";

function setupTelegramProfile() {

  const avatar =
    document.getElementById("avatar");

  if (!telegramUser) {
    avatar.textContent = "D";
    return;
  }

  if (telegramUser.photo_url) {

    avatar.innerHTML = `
      <img
        src="${escapeAttr(telegramUser.photo_url)}"
        alt="Profile"
      >
    `;

  } else {

    avatar.textContent =
      (telegramUser.first_name || "D")
        .charAt(0)
        .toUpperCase();
  }
}

setupTelegramProfile();

async function loadVideos() {

  try {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/videos?select=*&order=created_at.desc`,
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    if (!response.ok) {
      throw new Error(await response.text());
    }

    videos = await response.json();

  } catch (error) {

    console.error("VIDEO LOAD ERROR:", error);
    videos = [];
  }
}

async function loadSaved() {

  if (!userId) {
    savedIds = new Set();
    return;
  }

  try {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/saved_videos?telegram_user_id=eq.${userId}&select=video_id`,
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    if (!response.ok) {
      throw new Error(await response.text());
    }

    const data = await response.json();

    savedIds =
      new Set(data.map(item => Number(item.video_id)));

  } catch (error) {

    console.error("SAVED LOAD ERROR:", error);
    savedIds = new Set();
  }
}

async function toggleSave(videoId) {

  if (!userId) {
    alert("Please open this app from Telegram.");
    return;
  }

  const numericId = Number(videoId);

  if (savedIds.has(numericId)) {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/saved_videos?telegram_user_id=eq.${userId}&video_id=eq.${numericId}`,
      {
        method: "DELETE",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    if (response.ok) {
      savedIds.delete(numericId);
    }

  } else {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/saved_videos`,
      {
        method: "POST",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`,
          "Content-Type": "application/json",
          "Prefer": "return=minimal"
        },
        body: JSON.stringify({
          telegram_user_id: userId,
          video_id: numericId
        })
      }
    );

    if (response.ok) {
      savedIds.add(numericId);
    }
  }

  render();
}

async function addView(videoId) {

  try {

    const video =
      videos.find(v => Number(v.id) === Number(videoId));

    if (!video) return;

    const currentViews =
      Number(video.views || 0);

    const newViews =
      currentViews + 1;

    video.views = newViews;

    await fetch(
      `${SUPABASE_URL}/rest/v1/videos?id=eq.${videoId}`,
      {
        method: "PATCH",

        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`,
          "Content-Type": "application/json",
          "Prefer": "return=minimal"
        },

        body: JSON.stringify({
          views: newViews
        })
      }
    );

  } catch (error) {

    console.error("VIEW ERROR:", error);
  }
}

async function addLike(videoId) {

  try {

    const video =
      videos.find(v => Number(v.id) === Number(videoId));

    if (!video) return;

    const currentLikes =
      Number(video.likes || 0);

    const newLikes =
      currentLikes + 1;

    video.likes = newLikes;

    render();

    await fetch(
      `${SUPABASE_URL}/rest/v1/videos?id=eq.${videoId}`,
      {
        method: "PATCH",

        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`,
          "Content-Type": "application/json",
          "Prefer": "return=minimal"
        },

        body: JSON.stringify({
          likes: newLikes
        })
      }
    );

  } catch (error) {

    console.error("LIKE ERROR:", error);
  }
}

function render() {

  const content =
    document.getElementById("content");

  if (currentPage === "profile") {
    renderProfile();
    return;
  }

  let list = videos;

  if (currentPage === "viral") {

    list = videos.filter(
      video => video.category === "Viral"
    );
  }

  if (currentPage === "saved") {

    list = videos.filter(
      video => savedIds.has(Number(video.id))
    );
  }

  content.innerHTML = `

    <div class="hero">

      <h1>
        ${
          currentPage === "viral"
            ? "🔥 Viral Videos"
            : currentPage === "saved"
            ? "❤️ Saved Videos"
            : "Watch. Discover. Enjoy."
        }
      </h1>

      <p>
        ${
          currentPage === "viral"
            ? "Trending videos from Desi Hub TV."
            : currentPage === "saved"
            ? "Your saved videos."
            : "Fresh reels and viral videos in one place."
        }
      </p>

    </div>

    ${
      currentPage !== "saved"
      ? `
        <input
          id="search"
          class="search"
          type="text"
          placeholder="🔎 Search videos..."
        >
      `
      : ""
    }

    ${
      currentPage === "home"
      ? `
        <div class="categories">

          <button
            class="cat ${selectedCategory === "All" ? "active" : ""}"
            data-category="All"
          >All</button>

          <button
            class="cat ${selectedCategory === "Instagram" ? "active" : ""}"
            data-category="Instagram"
          >Instagram</button>

          <button
            class="cat ${selectedCategory === "TikTok" ? "active" : ""}"
            data-category="TikTok"
          >TikTok</button>

          <button
            class="cat ${selectedCategory === "Viral" ? "active" : ""}"
            data-category="Viral"
          >Viral</button>

        </div>
      `
      : ""
    }

    <div class="titlebar">

      <h2>Videos</h2>

      <span class="count">
        ${list.length} videos
      </span>

    </div>

    <div id="videoGrid" class="grid"></div>
  `;

  let filtered = list;

  if (currentPage === "home") {

    filtered = list.filter(video => {

      return selectedCategory === "All" ||
        video.category === selectedCategory;

    });
  }

  renderGrid(filtered);

  const search =
    document.getElementById("search");

  if (search) {

    search.addEventListener("input", () => {

      const term =
        search.value.toLowerCase();

      const results =
        filtered.filter(video =>
          (video.title || "")
            .toLowerCase()
            .includes(term)
        );

      renderGrid(results);

    });
  }

  document
    .querySelectorAll(".cat")
    .forEach(button => {

      button.addEventListener("click", () => {

        selectedCategory =
          button.dataset.category;

        render();

      });

    });
}

function renderGrid(list) {

  const grid =
    document.getElementById("videoGrid");

  if (!grid) return;

  if (!list.length) {

    grid.innerHTML =
      `<div class="empty">
        No videos found.
      </div>`;

    return;
  }

  grid.innerHTML = list.map(video => {

    const isSaved =
      savedIds.has(Number(video.id));

    const thumbnail =
      video.thumbnail_file_id
        ? `/api/thumbnail?file_id=${encodeURIComponent(video.thumbnail_file_id)}`
        : "";

    return `

      <div class="card">

        <div
          class="thumbnail"
          onclick="playVideo('${escapeAttr(video.file_id)}', ${Number(video.id)})"
        >

          ${
            thumbnail
              ? `
                <img
                  src="${thumbnail}"
                  alt=""
                  loading="lazy"
                >
              `
              : `
                <div class="thumbnail-placeholder">
                  🎬
                </div>
              `
          }

          <button
            class="save-btn ${isSaved ? "saved" : ""}"
            onclick="event.stopPropagation(); toggleSave(${Number(video.id)})"
          >
            ${isSaved ? "♥" : "♡"}
          </button>

          <div class="play">
            ▶
          </div>

        </div>

        <div class="card-info">

          <div class="card-title">
            ${escapeHtml(video.title || "Untitled")}
          </div>

          <div class="card-category">
            ${escapeHtml(video.category || "Other")}
          </div>

          <div class="stats">

            <span class="stat">
              👁 ${formatNumber(video.views || 0)}
            </span>

            <button
              class="like-btn stat"
              onclick="addLike(${Number(video.id)})"
            >
              ❤️ ${formatNumber(video.likes || 0)}
            </button>

          </div>

        </div>

      </div>
    `;

  }).join("");
}

function renderProfile() {

  const content =
    document.getElementById("content");

  const firstName =
    telegramUser?.first_name || "Telegram User";

  const lastName =
    telegramUser?.last_name || "";

  const fullName =
    `${firstName} ${lastName}`.trim();

  const username =
    telegramUser?.username
      ? `@${telegramUser.username}`
      : "Telegram account";

  let profileImage = "";

  if (telegramUser?.photo_url) {

    profileImage = `
      <img
        src="${escapeAttr(telegramUser.photo_url)}"
        alt="Telegram Profile"
      >
    `;

  } else {

    profileImage =
      escapeHtml(
        firstName.charAt(0).toUpperCase()
      );
  }

  content.innerHTML = `

    <div class="profile">

      <div class="profile-avatar">
        ${profileImage}
      </div>

      <h2>
        ${escapeHtml(fullName)}
      </h2>

      <div class="username">
        ${escapeHtml(username)}
      </div>

      <div class="info">
        ❤️ Saved Videos: ${savedIds.size}<br>
        🎬 Total Videos: ${videos.length}
      </div>

    </div>
  `;
}

function playVideo(fileId, videoId) {

  addView(videoId);

  const url =
    `/api/video?file_id=${encodeURIComponent(fileId)}`;

  const player =
    document.createElement("div");

  player.className = "player";

  player.innerHTML = `

    <button
      class="close-player"
      onclick="this.parentElement.remove()"
    >
      ×
    </button>

    <video
      controls
      autoplay
      playsinline
      preload="metadata"
    >

      <source
        src="${url}"
        type="video/mp4"
      >

    </video>

  `;

  document.body.appendChild(player);

  const video =
    player.querySelector("video");

  video.play().catch(() => {});
}

function setActive(buttonId) {

  document
    .querySelectorAll(".bottom button")
    .forEach(button =>
      button.classList.remove("active")
    );

  document
    .getElementById(buttonId)
    .classList.add("active");
}

document
  .getElementById("navHome")
  .addEventListener("click", () => {

    currentPage = "home";

    setActive("navHome");

    render();
  });

document
  .getElementById("navViral")
  .addEventListener("click", () => {

    currentPage = "viral";

    setActive("navViral");

    render();
  });

document
  .getElementById("navSaved")
  .addEventListener("click", () => {

    currentPage = "saved";

    setActive("navSaved");

    render();
  });

document
  .getElementById("navProfile")
  .addEventListener("click", () => {

    currentPage = "profile";

    setActive("navProfile");

    render();
  });

function formatNumber(number) {

  number = Number(number || 0);

  if (number >= 1000000) {
    return (number / 1000000).toFixed(1) + "M";
  }

  if (number >= 1000) {
    return (number / 1000).toFixed(1) + "K";
  }

  return String(number);
}

function escapeHtml(text) {

  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function escapeAttr(text) {

  return String(text)
    .replaceAll("\\", "\\\\")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

async function startApp() {

  await loadVideos();

  await loadSaved();

  render();
}

startApp();

</script>

</body>
</html>
