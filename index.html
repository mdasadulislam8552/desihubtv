<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Desi Hub TV</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #08090d;
      color: #fff;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    button,
    input {
      font-family: inherit;
    }

    .app {
      max-width: 650px;
      margin: auto;
      padding: 18px 14px 100px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .logo {
      font-size: 23px;
      font-weight: 800;
    }

    .logo span {
      color: #ff3158;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #ff3158;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
    }

    .hero {
      padding: 24px;
      border-radius: 22px;
      margin-bottom: 18px;
      background: linear-gradient(135deg, #27121c, #151720);
      border: 1px solid #2b2d38;
    }

    .hero h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .hero p {
      color: #a7a9b2;
      font-size: 14px;
    }

    .search {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid #2a2c36;
      background: #15161d;
      color: #fff;
      outline: none;
      font-size: 15px;
      margin-bottom: 15px;
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 22px;
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .cat {
      padding: 9px 15px;
      border-radius: 20px;
      border: 1px solid #30323d;
      background: #15161d;
      color: #bbb;
      white-space: nowrap;
    }

    .cat.active {
      background: #ff3158;
      border-color: #ff3158;
      color: #fff;
    }

    .titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .titlebar h2 {
      font-size: 19px;
    }

    .count {
      color: #777a84;
      font-size: 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .card {
      background: #15161d;
      border: 1px solid #292b35;
      border-radius: 16px;
      overflow: hidden;
    }

    .thumbnail {
      aspect-ratio: 9 / 13;
      background: linear-gradient(145deg, #242631, #101116);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
    }

    .play {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: rgba(255,49,88,.92);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      padding-left: 3px;
    }

    .save-btn {
      position: absolute;
      right: 8px;
      top: 8px;
      width: 35px;
      height: 35px;
      border: 0;
      border-radius: 50%;
      background: rgba(0,0,0,.65);
      color: #fff;
      font-size: 17px;
      z-index: 2;
    }

    .save-btn.saved {
      color: #ff3158;
    }

    .card-info {
      padding: 11px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-category {
      color: #ff5272;
      font-size: 12px;
      margin-top: 5px;
    }

    .loading,
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 45px 10px;
      color: #777a84;
    }

    .bottom {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      max-width: 650px;
      margin: auto;
      padding: 10px 5px calc(10px + env(safe-area-inset-bottom));
      background: rgba(12,13,18,.98);
      border-top: 1px solid #292b35;
      display: flex;
      justify-content: space-around;
      z-index: 100;
    }

    .bottom button {
      border: 0;
      background: none;
      color: #777;
      font-size: 12px;
      line-height: 18px;
    }

    .bottom button.active {
      color: #ff3158;
    }

    .profile {
      background: #15161d;
      border: 1px solid #292b35;
      border-radius: 20px;
      padding: 25px;
      text-align: center;
    }

    .profile-avatar {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      background: #ff3158;
      margin: 0 auto 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 800;
    }

    .profile h2 {
      margin-bottom: 7px;
    }

    .profile p {
      color: #888;
      font-size: 14px;
    }

    .player {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .player video {
      width: 100%;
      max-width: 700px;
      max-height: 90vh;
      background: #000;
    }

    .close-player {
      position: fixed;
      top: 15px;
      right: 15px;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,.15);
      color: white;
      font-size: 25px;
      z-index: 10000;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="logo">Desi <span>Hub TV</span></div>
    <div class="avatar" id="avatar">D</div>
  </div>

  <div id="content"></div>

</div>

<div class="bottom">

  <button id="navHome" class="active">
    🏠<br>Home
  </button>

  <button id="navViral">
    🔥<br>Viral
  </button>

  <button id="navSaved">
    ❤️<br>Saved
  </button>

  <button id="navProfile">
    👤<br>Profile
  </button>

</div>

<script>

const SUPABASE_URL =
  "https://icievlmrfbanhoaqvtwz.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_CgovIrCCYoka2GeHzjgLZg_lYbdy-D8";

const tg = window.Telegram?.WebApp;

if (tg) {
  tg.ready();
  tg.expand();
}

const telegramUser =
  tg?.initDataUnsafe?.user || null;

const userId =
  telegramUser?.id || null;

let videos = [];
let savedIds = new Set();
let currentPage = "home";
let selectedCategory = "All";

if (telegramUser) {

  document.getElementById("avatar").textContent =
    (telegramUser.first_name || "D")
      .charAt(0)
      .toUpperCase();
}

async function loadVideos() {

  try {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/videos?select=*&order=created_at.desc`,
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    if (!response.ok) {
      throw new Error(await response.text());
    }

    videos = await response.json();

  } catch (error) {

    console.error("VIDEO LOAD ERROR:", error);

    videos = [];
  }
}

async function loadSaved() {

  if (!userId) {
    savedIds = new Set();
    return;
  }

  try {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/saved_videos?telegram_user_id=eq.${userId}&select=video_id`,
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    if (!response.ok) {
      throw new Error(await response.text());
    }

    const data = await response.json();

    savedIds =
      new Set(data.map(item => Number(item.video_id)));

  } catch (error) {

    console.error("SAVED LOAD ERROR:", error);

    savedIds = new Set();
  }
}

async function toggleSave(videoId) {

  if (!userId) {

    alert("Please open this app from Telegram.");

    return;
  }

  const numericId = Number(videoId);

  if (savedIds.has(numericId)) {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/saved_videos?telegram_user_id=eq.${userId}&video_id=eq.${numericId}`,
      {
        method: "DELETE",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    if (response.ok) {
      savedIds.delete(numericId);
    }

  } else {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/saved_videos`,
      {
        method: "POST",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`,
          "Content-Type": "application/json",
          "Prefer": "return=minimal"
        },
        body: JSON.stringify({
          telegram_user_id: userId,
          video_id: numericId
        })
      }
    );

    if (response.ok) {
      savedIds.add(numericId);
    }
  }

  render();
}

function render() {

  const content =
    document.getElementById("content");

  if (currentPage === "profile") {

    renderProfile();
    return;
  }

  let list = videos;

  if (currentPage === "viral") {

    list = videos.filter(
      video => video.category === "Viral"
    );
  }

  if (currentPage === "saved") {

    list = videos.filter(
      video => savedIds.has(Number(video.id))
    );
  }

  content.innerHTML = `

    <div class="hero">
      <h1>
        ${
          currentPage === "viral"
            ? "🔥 Viral Videos"
            : currentPage === "saved"
            ? "❤️ Saved Videos"
            : "Watch. Discover. Enjoy."
        }
      </h1>

      <p>
        ${
          currentPage === "viral"
            ? "Trending videos from Desi Hub TV."
            : currentPage === "saved"
            ? "Your saved videos."
            : "Fresh reels and viral videos in one place."
        }
      </p>
    </div>

    ${
      currentPage !== "saved"
      ? `
        <input
          id="search"
          class="search"
          type="text"
          placeholder="🔎 Search videos..."
        >
      `
      : ""
    }

    ${
      currentPage === "home"
      ? `
        <div class="categories">

          <button
            class="cat ${selectedCategory === "All" ? "active" : ""}"
            data-category="All"
          >All</button>

          <button
            class="cat ${selectedCategory === "Instagram" ? "active" : ""}"
            data-category="Instagram"
          >Instagram</button>

          <button
            class="cat ${selectedCategory === "TikTok" ? "active" : ""}"
            data-category="TikTok"
          >TikTok</button>

          <button
            class="cat ${selectedCategory === "Viral" ? "active" : ""}"
            data-category="Viral"
          >Viral</button>

        </div>
      `
      : ""
    }

    <div class="titlebar">

      <h2>Videos</h2>

      <span class="count">
        ${list.length} videos
      </span>

    </div>

    <div id="videoGrid" class="grid"></div>
  `;

  let filtered = list;

  if (currentPage === "home") {

    filtered = list.filter(video => {

      return selectedCategory === "All" ||
        video.category === selectedCategory;

    });
  }

  renderGrid(filtered);

  const search =
    document.getElementById("search");

  if (search) {

    search.addEventListener("input", () => {

      const term =
        search.value.toLowerCase();

      const results = filtered.filter(video =>
        (video.title || "")
          .toLowerCase()
          .includes(term)
      );

      renderGrid(results);

    });
  }

  document
    .querySelectorAll(".cat")
    .forEach(button => {

      button.addEventListener("click", () => {

        selectedCategory =
          button.dataset.category;

        render();

      });

    });
}

function renderGrid(list) {

  const grid =
    document.getElementById("videoGrid");

  if (!grid) return;

  if (!list.length) {

    grid.innerHTML =
      `<div class="empty">
        No videos found.
      </div>`;

    return;
  }

  grid.innerHTML = list.map(video => {

    const isSaved =
      savedIds.has(Number(video.id));

    return `

      <div class="card">

        <div
          class="thumbnail"
          onclick="playVideo('${escapeAttr(video.file_id)}')"
        >

          <button
            class="save-btn ${isSaved ? "saved" : ""}"
            onclick="event.stopPropagation(); toggleSave(${Number(video.id)})"
          >
            ${isSaved ? "♥" : "♡"}
          </button>

          <div class="play">
            ▶
          </div>

        </div>

        <div class="card-info">

          <div class="card-title">
            ${escapeHtml(video.title || "Untitled")}
          </div>

          <div class="card-category">
            ${escapeHtml(video.category || "Other")}
          </div>

        </div>

      </div>
    `;

  }).join("");
}

function renderProfile() {

  const content =
    document.getElementById("content");

  const name =
    telegramUser?.first_name || "Telegram User";

  const username =
    telegramUser?.username
      ? `@${telegramUser.username}`
      : "Telegram account";

  content.innerHTML = `

    <div class="profile">

      <div class="profile-avatar">
        ${name.charAt(0).toUpperCase()}
      </div>

      <h2>
        ${escapeHtml(name)}
      </h2>

      <p>
        ${escapeHtml(username)}
      </p>

      <p style="margin-top:15px;">
        Saved Videos: ${savedIds.size}
      </p>

    </div>
  `;
}

function playVideo(fileId) {

  const url =
    `/api/video?file_id=${encodeURIComponent(fileId)}`;

  const player =
    document.createElement("div");

  player.className = "player";

  player.innerHTML = `

    <button
      class="close-player"
      onclick="this.parentElement.remove()"
    >
      ×
    </button>

    <video
      controls
      autoplay
      playsinline
      preload="metadata"
    >

      <source
        src="${url}"
        type="video/mp4"
      >

    </video>
  `;

  document.body.appendChild(player);

  const video =
    player.querySelector("video");

  video.play().catch(() => {});
}

function setActive(buttonId) {

  document
    .querySelectorAll(".bottom button")
    .forEach(button =>
      button.classList.remove("active")
    );

  document
    .getElementById(buttonId)
    .classList.add("active");
}

document
  .getElementById("navHome")
  .addEventListener("click", async () => {

    currentPage = "home";

    setActive("navHome");

    render();
  });

document
  .getElementById("navViral")
  .addEventListener("click", async () => {

    currentPage = "viral";

    setActive("navViral");

    render();
  });

document
  .getElementById("navSaved")
  .addEventListener("click", async () => {

    currentPage = "saved";

    setActive("navSaved");

    render();
  });

document
  .getElementById("navProfile")
  .addEventListener("click", async () => {

    currentPage = "profile";

    setActive("navProfile");

    render();
  });

function escapeHtml(text) {

  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function escapeAttr(text) {

  return String(text)
    .replaceAll("\\", "\\\\")
    .replaceAll("'", "\\'");
}

async function startApp() {

  await loadVideos();

  await loadSaved();

  render();
}

startApp();

</script>

</body>
</html>
